name: Deploy Spore Cybernetics to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Change workers.dev account subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          STATUS=$(curl -sS -o /tmp/workers-subdomain.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API")
          if [ "$STATUS" != "200" ]; then
            echo "Could not read current workers.dev subdomain (HTTP $STATUS):"
            jq '{success, errors, messages}' /tmp/workers-subdomain.json
            exit 1
          fi
          CURRENT=$(jq -r '.result.subdomain // empty' /tmp/workers-subdomain.json)
          if [ "$CURRENT" = "spore-cybernetics" ]; then
            echo "Account already uses spore-cybernetics.workers.dev"
          elif [ "$CURRENT" = "sporeafrica" ]; then
            STATUS=$(curl -sS -o /tmp/workers-subdomain-update.json -w "%{http_code}" \
              -X PUT "$API" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"subdomain":"spore-cybernetics"}')
            if [ "$STATUS" != "200" ] || [ "$(jq -r '.success' /tmp/workers-subdomain-update.json)" != "true" ]; then
              echo "Cloudflare could not change the workers.dev subdomain (HTTP $STATUS):"
              jq '{success, errors, messages}' /tmp/workers-subdomain-update.json
              exit 1
            fi
            echo "Changed account subdomain to $(jq -r '.result.subdomain' /tmp/workers-subdomain-update.json).workers.dev"
          else
            echo "Account subdomain is '$CURRENT', not the expected sporeafrica; refusing unexpected change."
            exit 1
          fi

      - name: Build Worker
        run: npm run build:vinext
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}

      - name: Apply database schema safely
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}

      - name: Seed initial services and administrator
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Configure Cloudflare runtime database connection
        run: printf '%s' "$NEON_POOLED_URL" | npx wrangler secret put DATABASE_URL --name spore-cybernetics-platform
        env:
          NEON_POOLED_URL: ${{ secrets.NEON_POOLED_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Cloudflare authentication secret
        run: printf '%s' "$AUTH_SECRET" | npx wrangler secret put AUTH_SECRET --name spore-cybernetics-platform
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx @vinext/cloudflare deploy --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
