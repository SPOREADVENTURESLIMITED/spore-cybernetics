name: Deploy Spore Cybernetics to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'cloudflare.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Set workers.dev account subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          STATUS=$(curl -sS -o /tmp/workers-subdomain.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API")
          CURRENT=""
          if [ "$STATUS" = "200" ]; then
            CURRENT=$(jq -r '.result.subdomain // empty' /tmp/workers-subdomain.json)
          elif [ "$STATUS" != "404" ]; then
            echo "Could not read current workers.dev subdomain (HTTP $STATUS):"
            jq '{success, errors, messages}' /tmp/workers-subdomain.json
            exit 1
          fi

          if [ "$CURRENT" = "spore-cybernetics" ]; then
            echo "Account already uses spore-cybernetics.workers.dev"
            exit 0
          fi
          if [ "$CURRENT" = "sporeafrica" ]; then
            echo "Removing existing sporeafrica.workers.dev subdomain..."
            DELETE_STATUS=$(curl -sS -o /tmp/workers-subdomain-delete.json -w "%{http_code}" \
              -X DELETE "$API" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            if [ "$DELETE_STATUS" != "204" ] && [ "$DELETE_STATUS" != "200" ]; then
              echo "Cloudflare could not remove the old subdomain (HTTP $DELETE_STATUS):"
              jq '{success, errors, messages}' /tmp/workers-subdomain-delete.json || true
              exit 1
            fi
          elif [ -n "$CURRENT" ]; then
            echo "Unexpected existing account subdomain '$CURRENT'; refusing change."
            exit 1
          else
            echo "No account subdomain currently registered; proceeding to create requested one."
          fi

          echo "Registering spore-cybernetics.workers.dev..."
          CREATE_STATUS=$(curl -sS -o /tmp/workers-subdomain-create.json -w "%{http_code}" \
            -X PUT "$API" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"subdomain":"spore-cybernetics"}')
          if [ "$CREATE_STATUS" = "200" ] && [ "$(jq -r '.success' /tmp/workers-subdomain-create.json)" = "true" ]; then
            echo "Successfully set account subdomain to spore-cybernetics.workers.dev"
          else
            echo "Registration failed (HTTP $CREATE_STATUS):"
            jq '{success, errors, messages}' /tmp/workers-subdomain-create.json || true
            if [ "$CURRENT" = "sporeafrica" ]; then
              echo "Attempting to restore sporeafrica..."
              RESTORE_STATUS=$(curl -sS -o /tmp/workers-subdomain-restore.json -w "%{http_code}" \
                -X PUT "$API" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data '{"subdomain":"sporeafrica"}')
              if [ "$RESTORE_STATUS" = "200" ] && [ "$(jq -r '.success' /tmp/workers-subdomain-restore.json)" = "true" ]; then
                echo "Restored sporeafrica.workers.dev successfully."
              else
                echo "WARNING: automatic restoration failed (HTTP $RESTORE_STATUS):"
                jq '{success, errors, messages}' /tmp/workers-subdomain-restore.json || true
              fi
            fi
            exit 1
          fi

      - name: Build Worker
        run: npm run build:vinext
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}

      - name: Apply database schema safely
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}

      - name: Seed initial services and administrator
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Configure Cloudflare runtime database connection
        run: printf '%s' "$NEON_POOLED_URL" | npx wrangler secret put DATABASE_URL --name spore-cybernetics-platform
        env:
          NEON_POOLED_URL: ${{ secrets.NEON_POOLED_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Cloudflare authentication secret
        run: printf '%s' "$AUTH_SECRET" | npx wrangler secret put AUTH_SECRET --name spore-cybernetics-platform
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx @vinext/cloudflare deploy --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
