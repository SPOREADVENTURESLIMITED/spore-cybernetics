name: Build Spore Cybernetics Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'capacitor.config.json'
      - 'components/pwa-install-button.tsx'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor Android tooling
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          mkdir -p www
          npx cap add android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/spore-cybernetics.apk

      - name: Publish downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Spore Cybernetics for Android
          prerelease: true
          make_latest: false
          files: dist/spore-cybernetics.apk
          fail_on_unmatched_files: true
